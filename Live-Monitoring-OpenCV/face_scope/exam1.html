<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProctorScope — Exam</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=Outfit:wght@300;500;700&display=swap');
 
  :root {
    --bg:      #0d0f14;
    --surface: #13161f;
    --panel:   #1a1d28;
    --border:  #252840;
    --green:   #00e07a;
    --red:     #ff3d55;
    --orange:  #ffaa00;
    --blue:    #4db8ff;
    --text:    #cdd5f0;
    --muted:   #50566e;
    --mono:    'IBM Plex Mono', monospace;
    --sans:    'Outfit', sans-serif;
  }
 
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
 
  /* ── Header ─────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
 
  .brand {
    font-family: var(--mono);
    font-size: 1rem;
    font-weight: 600;
    color: var(--blue);
    letter-spacing: -0.02em;
  }
 
  .brand span { color: var(--green); }
 
  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }
 
  #timer {
    font-family: var(--mono);
    font-size: 1.1rem;
    color: var(--text);
    letter-spacing: 0.05em;
  }
 
  /* ── Warning overlay (shown on tab switch) ───────────── */
  #warning-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255, 61, 85, 0.18);
    backdrop-filter: blur(2px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    animation: pulse-bg 1s ease-in-out infinite alternate;
  }
 
  #warning-overlay.show { display: flex; }
 
  @keyframes pulse-bg {
    from { background: rgba(255,61,85,0.14); }
    to   { background: rgba(255,61,85,0.28); }
  }
 
  .warn-box {
    background: var(--surface);
    border: 2px solid var(--red);
    border-radius: 14px;
    padding: 36px 48px;
    text-align: center;
    box-shadow: 0 0 60px rgba(255,61,85,0.3);
    animation: warn-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
 
  @keyframes warn-in {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }
 
  .warn-icon  { font-size: 3rem; margin-bottom: 12px; }
  .warn-title {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--red);
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }
  .warn-sub {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 24px;
  }
 
  .btn-dismiss {
    font-family: var(--mono);
    font-size: 0.8rem;
    padding: 10px 28px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: opacity 0.2s;
  }
  .btn-dismiss:hover { opacity: 0.85; }
 
  /* ── Main layout ─────────────────────────────────────── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
  }
 
  /* ── Exam area ───────────────────────────────────────── */
  .exam-area {
    padding: 36px 40px;
    border-right: 1px solid var(--border);
  }
 
  .exam-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
 
  .exam-title {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
 
  .exam-badge {
    font-family: var(--mono);
    font-size: 0.65rem;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--green);
    color: var(--green);
    letter-spacing: 0.08em;
  }
 
  /* Progress bar */
  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 36px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }
 
  /* Question card */
  .question-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 32px;
    margin-bottom: 20px;
  }
 
  .q-number {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
 
  .q-text {
    font-size: 1rem;
    line-height: 1.7;
    font-weight: 500;
    margin-bottom: 24px;
  }
 
  /* Options */
  .options { display: flex; flex-direction: column; gap: 10px; }
 
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    border: 1px solid var(--border);
    border-radius: 9px;
    cursor: pointer;
    transition: border-color 0.18s, background 0.18s;
    background: var(--surface);
  }
 
  .option:hover { border-color: var(--blue); background: rgba(77,184,255,0.05); }
  .option.selected { border-color: var(--green); background: rgba(0,224,122,0.07); }
 
  .option input[type=radio] { display: none; }
 
  .opt-dot {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-radius: 50%;
    flex-shrink: 0;
    transition: border-color 0.18s, background 0.18s;
    display: flex; align-items: center; justify-content: center;
  }
 
  .option.selected .opt-dot {
    border-color: var(--green);
    background: var(--green);
  }
 
  .opt-dot::after {
    content: '';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--bg);
    display: none;
  }
 
  .option.selected .opt-dot::after { display: block; }
 
  .opt-label { font-size: 0.9rem; line-height: 1.5; }
 
  /* Nav buttons */
  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
  }
 
  .btn {
    font-family: var(--mono);
    font-size: 0.75rem;
    padding: 11px 24px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: border-color 0.18s, background 0.18s;
  }
 
  .btn:hover { border-color: var(--blue); }
  .btn.primary { background: var(--green); color: #0d0f14; border-color: var(--green); font-weight: 600; }
  .btn.primary:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
 
  /* ── Sidebar ─────────────────────────────────────────── */
  .sidebar {
    padding: 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
 
  .sidebar-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
 
  .sidebar-head {
    font-family: var(--mono);
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
 
  /* Status indicator */
  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
  }
 
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    animation: blink 1.4s ease-in-out infinite;
  }
 
  @keyframes blink {
    0%,100% { opacity:1; } 50% { opacity:0.3; }
  }
 
  .status-label { font-size: 0.82rem; }
 
  /* Violation counter */
  .viol-count {
    padding: 16px;
    text-align: center;
  }
 
  .viol-num {
    font-family: var(--mono);
    font-size: 2.4rem;
    font-weight: 600;
    color: var(--red);
    line-height: 1;
  }
 
  .viol-sub {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 4px;
    font-family: var(--mono);
  }
 
  /* Violation log */
  #violation-log {
    max-height: 240px;
    overflow-y: auto;
    padding: 8px 0;
  }
 
  .viol-entry {
    padding: 9px 16px;
    border-bottom: 1px solid var(--border);
    animation: slide-in 0.3s ease;
  }
 
  @keyframes slide-in {
    from { opacity:0; transform: translateX(10px); }
    to   { opacity:1; transform: translateX(0); }
  }
 
  .viol-entry:last-child { border-bottom: none; }
 
  .viol-type {
    font-family: var(--mono);
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    margin-bottom: 2px;
  }
 
  .viol-time {
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--muted);
  }
 
  .type-tab    { color: var(--red); }
  .type-blur   { color: var(--orange); }
  .type-focus  { color: var(--green); }
 
  /* Save button */
  .save-row {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }
 
  .btn-save {
    width: 100%;
    font-family: var(--mono);
    font-size: 0.7rem;
    padding: 9px;
    background: rgba(77,184,255,0.1);
    border: 1px solid rgba(77,184,255,0.3);
    color: var(--blue);
    border-radius: 7px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: background 0.2s;
  }
 
  .btn-save:hover { background: rgba(77,184,255,0.2); }
 
  /* Empty state */
  .empty-log {
    padding: 20px 16px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    font-family: var(--mono);
  }
 
  /* Scrollbar */
  #violation-log::-webkit-scrollbar { width: 4px; }
  #violation-log::-webkit-scrollbar-track { background: transparent; }
  #violation-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
 
<!-- ══ WARNING OVERLAY (shown on tab switch / blur) ══════════════════════════ -->
<div id="warning-overlay">
  <div class="warn-box">
    <div class="warn-icon">⚠️</div>
    <div class="warn-title" id="warn-title">Tab Switch Detected</div>
    <div class="warn-sub" id="warn-sub">This incident has been logged and will be reported.</div>
    <button class="btn-dismiss" onclick="dismissWarning()">Return to Exam</button>
  </div>
</div>
 
<!-- ══ HEADER ════════════════════════════════════════════════════════════════ -->
<header>
  <div class="brand">Proctor<span>Scope</span></div>
  <div class="header-right">
    <div id="timer">00:00</div>
  </div>
</header>
 
<!-- ══ MAIN ══════════════════════════════════════════════════════════════════ -->
<main>
 
  <!-- Exam area -->
  <div class="exam-area">
    <div class="exam-meta">
      <div class="exam-title">Sample Examination</div>
      <div class="exam-badge">PROCTORED</div>
    </div>
 
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
 
    <div id="question-container"></div>
 
    <div class="nav-row">
      <button class="btn" id="btn-prev" onclick="prevQuestion()" disabled>← Previous</button>
      <span id="q-counter" style="font-family:var(--mono);font-size:0.72rem;color:var(--muted)"></span>
      <button class="btn primary" id="btn-next" onclick="nextQuestion()">Next →</button>
    </div>
  </div>
 
  <!-- Sidebar -->
  <div class="sidebar">
 
    <!-- Monitoring status -->
    <div class="sidebar-section">
      <div class="sidebar-head">Monitoring Status</div>
      <div class="status-row">
        <div class="status-dot" id="status-dot" style="background:var(--green)"></div>
        <div class="status-label" id="status-label">Exam in progress</div>
      </div>
    </div>
 
    <!-- Violation counter -->
    <div class="sidebar-section">
      <div class="sidebar-head">Violations</div>
      <div class="viol-count">
        <div class="viol-num" id="viol-num">0</div>
        <div class="viol-sub">incidents recorded</div>
      </div>
    </div>
 
    <!-- Violation log -->
    <div class="sidebar-section" style="flex:1">
      <div class="sidebar-head">Incident Log</div>
      <div id="violation-log">
        <div class="empty-log" id="empty-msg">No violations yet</div>
      </div>
      <div class="save-row">
        <button class="btn-save" onclick="saveViolations()">⬇ Save Log to violations.json</button>
      </div>
    </div>
 
  </div>
</main>
 
<script>
// ─────────────────────────────────────────────────────────────────────────────
// QUESTIONS — replace with your own exam questions
// ─────────────────────────────────────────────────────────────────────────────
const questions = [
  {
    text: "What does CPU stand for?",
    options: ["Central Processing Unit", "Computer Personal Unit", "Central Program Utility", "Core Processing Unit"],
    answer: 0
  },
  {
    text: "Which of the following is NOT a programming language?",
    options: ["Python", "Photoshop", "JavaScript", "Java"],
    answer: 1
  },
  {
    text: "What does HTML stand for?",
    options: ["Hyper Transfer Markup Language", "HyperText Markup Language", "High Text Machine Language", "Hyper Tool Multi Language"],
    answer: 1
  },
  {
    text: "Which data structure works on a LIFO (Last In First Out) principle?",
    options: ["Queue", "Array", "Stack", "Linked List"],
    answer: 2
  },
  {
    text: "What is the binary representation of the decimal number 10?",
    options: ["1010", "1100", "1001", "0110"],
    answer: 0
  }
];
 
// ─────────────────────────────────────────────────────────────────────────────
// EXAM STATE
// ─────────────────────────────────────────────────────────────────────────────
let currentQ   = 0;
let answers    = new Array(questions.length).fill(null);
let violations = [];   // [{type, time, detail, timestamp}]
let examStart  = Date.now();
let warningActive = false;
 
// ─────────────────────────────────────────────────────────────────────────────
// TIMER
// ─────────────────────────────────────────────────────────────────────────────
setInterval(() => {
  const elapsed = Math.floor((Date.now() - examStart) / 1000);
  const m = String(Math.floor(elapsed / 60)).padStart(2,'0');
  const s = String(elapsed % 60).padStart(2,'0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}, 1000);
 
// ─────────────────────────────────────────────────────────────────────────────
// RENDER QUESTION
// ─────────────────────────────────────────────────────────────────────────────
function renderQuestion() {
  const q   = questions[currentQ];
  const sel = answers[currentQ];
  const pct = ((currentQ) / questions.length) * 100;
 
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('q-counter').textContent =
    `Question ${currentQ + 1} of ${questions.length}`;
  document.getElementById('btn-prev').disabled = currentQ === 0;
  document.getElementById('btn-next').textContent =
    currentQ === questions.length - 1 ? 'Submit ✓' : 'Next →';
 
  const container = document.getElementById('question-container');
  container.innerHTML = `
    <div class="question-card">
      <div class="q-number">Question ${currentQ + 1}</div>
      <div class="q-text">${q.text}</div>
      <div class="options">
        ${q.options.map((opt, i) => `
          <label class="option ${sel === i ? 'selected' : ''}" onclick="selectOption(${i})">
            <input type="radio" name="q${currentQ}" ${sel === i ? 'checked' : ''}>
            <div class="opt-dot"></div>
            <span class="opt-label">${opt}</span>
          </label>
        `).join('')}
      </div>
    </div>
  `;
}
 
function selectOption(i) {
  answers[currentQ] = i;
  renderQuestion();
}
 
function nextQuestion() {
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    alert(`Exam submitted!\nViolations: ${violations.length}`);
  }
}
 
function prevQuestion() {
  if (currentQ > 0) { currentQ--; renderQuestion(); }
}
 
renderQuestion();
 
// ─────────────────────────────────────────────────────────────────────────────
// TAB SWITCH & WINDOW BLUR DETECTION
// The browser fires these events natively — no server needed.
// ─────────────────────────────────────────────────────────────────────────────
 
/**
 * logViolation(type, detail)
 * Adds an entry to the violations array and updates the sidebar UI.
 * type:   "TAB_SWITCH" | "WINDOW_BLUR" | "WINDOW_FOCUS"
 * detail: human-readable description
 */
function logViolation(type, detail) {
  const now   = new Date();
  const tstr  = now.toTimeString().slice(0, 8);  // HH:MM:SS
  const entry = { type, time: tstr, detail, timestamp: now.toISOString() };
 
  violations.push(entry);
 
  // Update counter
  document.getElementById('viol-num').textContent = violations.length;
 
  // Remove empty message
  const empty = document.getElementById('empty-msg');
  if (empty) empty.remove();
 
  // Add log entry to sidebar
  const log  = document.getElementById('violation-log');
  const div  = document.createElement('div');
  div.className = 'viol-entry';
  const cls  = type === 'TAB_SWITCH' ? 'type-tab'
             : type === 'WINDOW_BLUR' ? 'type-blur'
             : 'type-focus';
  div.innerHTML = `
    <div class="viol-type ${cls}">${type.replace('_',' ')}</div>
    <div class="viol-time">${tstr} — ${detail}</div>
  `;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
 
// ── visibilitychange: fires when the user switches tabs or minimises ──────────
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    // Candidate left the exam tab
    logViolation('TAB_SWITCH', 'Candidate switched away from exam tab');
    showWarning('Tab Switch Detected', 'You navigated away from the exam. This has been recorded.');
  } else {
    // Candidate returned
    logViolation('WINDOW_FOCUS', 'Candidate returned to exam tab');
  }
});
 
// ── blur: fires when the browser window loses focus (alt+tab, click elsewhere)
window.addEventListener('blur', () => {
  // Only log if tab is still visible (otherwise visibilitychange already caught it)
  if (document.visibilityState === 'visible') {
    logViolation('WINDOW_BLUR', 'Browser window lost focus (Alt+Tab or click outside)');
    showWarning('Window Focus Lost', 'You switched to another application. This has been recorded.');
  }
});
 
// ─────────────────────────────────────────────────────────────────────────────
// WARNING OVERLAY
// ─────────────────────────────────────────────────────────────────────────────
function showWarning(title, sub) {
  if (warningActive) return;
  warningActive = true;
  document.getElementById('warn-title').textContent = title;
  document.getElementById('warn-sub').textContent   = sub;
  document.getElementById('warning-overlay').classList.add('show');
 
  // Update sidebar status
  document.getElementById('status-dot').style.background   = 'var(--red)';
  document.getElementById('status-label').textContent = 'VIOLATION DETECTED';
}
 
function dismissWarning() {
  warningActive = false;
  document.getElementById('warning-overlay').classList.remove('show');
  document.getElementById('status-dot').style.background   = 'var(--green)';
  document.getElementById('status-label').textContent = 'Exam in progress';
}
 
// ─────────────────────────────────────────────────────────────────────────────
// SAVE VIOLATIONS — downloads violations.json so face_detection.py can read it
// ─────────────────────────────────────────────────────────────────────────────
function saveViolations() {
  const blob = new Blob([JSON.stringify(violations, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'violations.json';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
